<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini 醫療教學 Prompt 範本庫</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1a1a2e;
            --ink-light: #4a4a6a;
            --paper: #f5f0e8;
            --paper-warm: #ede8dc;
            --accent: #c0392b;
            --accent-gold: #d4a857;
            --accent-teal: #1a7a6a;
            --accent-blue: #2563a8;
            --card-bg: #faf7f2;
            --border: rgba(26,26,46,0.12);
            --shadow: 0 2px 20px rgba(26,26,46,0.08);
            --shadow-hover: 0 8px 40px rgba(26,26,46,0.16);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--paper);
            color: var(--ink);
            min-height: 100vh;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(192,57,43,0.04) 0%, transparent 50%),
                radial-gradient(circle at 85% 80%, rgba(26,122,106,0.05) 0%, transparent 50%),
                url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%231a1a2e' fill-opacity='0.02'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        /* ── HEADER ── */
        .header {
            text-align: center;
            padding: 64px 24px 48px;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-teal), var(--accent-gold), var(--accent));
        }

        .header-eyebrow {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--accent-teal);
            margin-bottom: 16px;
            opacity: 0;
            animation: fadeUp 0.6s ease forwards 0.1s;
        }

        .header h1 {
            font-family: 'Noto Serif TC', serif;
            font-size: clamp(1.6rem, 4vw, 2.8rem);
            font-weight: 700;
            line-height: 1.3;
            color: var(--ink);
            margin-bottom: 16px;
            opacity: 0;
            animation: fadeUp 0.6s ease forwards 0.2s;
        }

        .header h1 span {
            color: var(--accent);
            position: relative;
        }

        .header h1 span::after {
            content: '';
            position: absolute;
            bottom: 2px; left: 0; right: 0;
            height: 2px;
            background: var(--accent-gold);
            transform: scaleX(0);
            transform-origin: left;
            animation: underlineIn 0.5s ease forwards 0.8s;
        }

        .header p {
            font-size: 0.95rem;
            color: var(--ink-light);
            font-weight: 300;
            letter-spacing: 0.02em;
            opacity: 0;
            animation: fadeUp 0.6s ease forwards 0.35s;
        }

        /* ── FILTER BAR ── */
        .filter-bar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 0 24px 40px;
            opacity: 0;
            animation: fadeUp 0.6s ease forwards 0.5s;
        }

        .filter-btn {
            padding: 6px 16px;
            border: 1.5px solid var(--border);
            border-radius: 100px;
            background: transparent;
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 0.78rem;
            color: var(--ink-light);
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.03em;
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--ink);
            color: var(--paper);
            border-color: var(--ink);
        }

        /* ── STATS ROW ── */
        .stats-row {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding-bottom: 48px;
            opacity: 0;
            animation: fadeUp 0.6s ease forwards 0.6s;
        }

        .stat {
            text-align: center;
        }

        .stat-num {
            font-family: 'Noto Serif TC', serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
            line-height: 1;
        }

        .stat-label {
            font-size: 0.72rem;
            color: var(--ink-light);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-top: 4px;
        }

        /* ── GRID ── */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px 80px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 20px;
        }

        /* ── CARD ── */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: box-shadow 0.3s ease, transform 0.3s ease;
            opacity: 0;
            animation: cardIn 0.5s ease forwards;
            position: relative;
        }

        .card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-3px);
        }

        .card-accent-strip {
            height: 3px;
            background: linear-gradient(90deg, var(--card-color-1, #c0392b), var(--card-color-2, #d4a857));
        }

        .card-header {
            padding: 18px 20px 14px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .card-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .card h3 {
            font-family: 'Noto Serif TC', serif;
            font-size: 1rem;
            font-weight: 600;
            color: var(--ink);
            line-height: 1.4;
            flex: 1;
        }

        .card-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.62rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 4px;
            background: var(--paper-warm);
            color: var(--ink-light);
            flex-shrink: 0;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border) 20%, var(--border) 80%, transparent);
            margin: 0 20px;
        }

        .prompt-box {
            background: var(--paper);
            border: none;
            padding: 16px 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            line-height: 1.7;
            flex-grow: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 180px;
            color: var(--ink-light);
            cursor: text;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        .prompt-box::-webkit-scrollbar { width: 4px; }
        .prompt-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .card-footer {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--border);
        }

        .char-count {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            color: var(--ink-light);
            opacity: 0.6;
        }

        .copy-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--ink);
            color: var(--paper);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.03em;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .copy-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--accent);
            transform: translateX(-100%);
            transition: transform 0.3s ease;
        }

        .copy-btn span { position: relative; z-index: 1; }

        .copy-btn:hover::before { transform: translateX(0); }
        .copy-btn:hover { transform: translateY(-1px); }

        .copy-btn.copied {
            background: var(--accent-teal);
        }

        .copy-btn.copied::before { transform: translateX(0); background: var(--accent-teal); }

        .copy-icon { font-size: 0.85rem; position: relative; z-index: 1; }

        /* ── FOOTER ── */
        .page-footer {
            text-align: center;
            padding: 32px;
            border-top: 1px solid var(--border);
            font-size: 0.75rem;
            color: var(--ink-light);
            letter-spacing: 0.05em;
        }

        /* ── ANIMATIONS ── */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes underlineIn {
            to { transform: scaleX(1); }
        }

        @keyframes ripple {
            from { transform: scale(0); opacity: 0.3; }
            to   { transform: scale(4); opacity: 0; }
        }

        /* ── SEARCH BOX ── */
        .search-wrap {
            display: flex;
            justify-content: center;
            padding: 0 24px 32px;
            opacity: 0;
            animation: fadeUp 0.6s ease forwards 0.4s;
        }

        .search-input {
            width: 100%;
            max-width: 480px;
            padding: 10px 20px;
            border: 1.5px solid var(--border);
            border-radius: 100px;
            background: var(--card-bg);
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 0.88rem;
            color: var(--ink);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input::placeholder { color: var(--ink-light); opacity: 0.5; }
        .search-input:focus {
            border-color: var(--accent-teal);
            box-shadow: 0 0 0 3px rgba(26,122,106,0.1);
        }

        /* Card color themes */
        .theme-red  { --card-color-1: #c0392b; --card-color-2: #e74c3c; }
        .theme-gold { --card-color-1: #c8961a; --card-color-2: #f39c12; }
        .theme-teal { --card-color-1: #1a7a6a; --card-color-2: #27ae60; }
        .theme-blue { --card-color-1: #2563a8; --card-color-2: #3498db; }
        .theme-plum { --card-color-1: #7d3c98; --card-color-2: #9b59b6; }

        .icon-red  { background: rgba(192,57,43,0.1);  color: var(--accent); }
        .icon-gold { background: rgba(212,168,87,0.15); color: #c8961a; }
        .icon-teal { background: rgba(26,122,106,0.1);  color: var(--accent-teal); }
        .icon-blue { background: rgba(37,99,168,0.1);   color: var(--accent-blue); }
        .icon-plum { background: rgba(125,60,152,0.1);  color: #7d3c98; }

        /* Responsive */
        @media (max-width: 600px) {
            .container { grid-template-columns: 1fr; }
            .stats-row { gap: 24px; }
            .stat-num { font-size: 1.5rem; }
        }
    </style>
</head>

            content: `用引導式學習方式，教我如何參與醫療人員的跨領域個案討論，先讓我回答一個基本問題，再根據我的回覆逐步增加難度。`
        },
        {
            title: "藥師 PBL 劇本",
            tag: "教學",
            icon: "📝",
            theme: "red",
            content: `角色與任務：你現在是一位具備 15 年醫學中心經驗的「資深臨床藥師」與「PBL 教案撰寫專家」。請為新進藥師（PGY）設計一份關於**「多重用藥與高危險藥物交互作用」**的標準化 PBL 劇本。

病患設定
1. 案例：78 歲男性，具備心房顫動（Afib）、第二型糖尿病、高血壓病史。
2. 近期事件：因疑似泌尿道感染（UTI）於地區診所就醫，並自行購買保健食品。

核心考點
1. 抗凝血劑（如 Warfarin 或 DOACs）與抗生素（如 TMP/SMX）的交互作用導致出血風險增加。
2. 保健食品（如銀杏 Ginkgo）對凝血功能的隱性影響。

輸出格式限制
請以「表格」呈現，並分為三個階段（幕）：
第一幕（門診領藥/病患主訴）：只給症狀描述與不完整的用藥史，包含 3 項干擾資訊。
第二幕（檢驗數據與完整藥歷）：提供雲端藥歷清單（需包含 6 種以上藥物）與異常的凝血功能數據（如 INR 升高）。
第三幕（臨床決策與處置）：列出標準解答、藥師應介入的具體建議（Intervention），以及 3 個引導學員討論的問題。

語言與風格
繁體中文，使用台灣臨床常見之醫學與藥學縮寫（如：BID, QD, INR, eGFR），語氣需專業客觀，嚴禁使用任何行銷或誇飾用語。`
        }
    ];

    /* ── Build tag list ── */
    const allTags = [...new Set(promptData.map(p => p.tag))];
    const filterBar = document.getElementById('filter-bar');
    allTags.forEach(tag => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.dataset.filter = tag;
        btn.textContent = tag;
        filterBar.appendChild(btn);
    });

    /* ── Render cards ── */
    const container = document.getElementById('prompt-container');
    const totalCount = document.getElementById('total-count');
    const visibleCount = document.getElementById('visible-count');
    totalCount.textContent = promptData.length;
    visibleCount.textContent = promptData.length;

    let cards = [];

    promptData.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = `card theme-${item.theme}`;
        card.dataset.tag = item.tag;
        card.dataset.title = item.title;
        card.dataset.content = item.content.toLowerCase();
        card.style.animationDelay = `${0.05 * (index % 12)}s`;

        card.innerHTML = `
            <div class="card-accent-strip"></div>
            <div class="card-header">
                <div class="card-icon icon-${item.theme}">${item.icon}</div>
                <h3>${item.title}</h3>
                <span class="card-tag">${item.tag}</span>
            </div>
            <div class="divider"></div>
            <div class="prompt-box" id="prompt-${index}">${item.content}</div>
            <div class="card-footer">
                <span class="char-count">${item.content.length} 字元</span>
                <button class="copy-btn" onclick="copyText(${index}, this)">
                    <span class="copy-icon">⎘</span>
                    <span>複製 Prompt</span>
                </button>
            </div>
        `;
        container.appendChild(card);
        cards.push(card);
    });

    /* ── Filter logic ── */
    let activeFilter = 'all';
    let searchQuery = '';

    function applyFilters() {
        let visible = 0;
        cards.forEach(card => {
            const matchTag = activeFilter === 'all' || card.dataset.tag === activeFilter;
            const matchSearch = !searchQuery ||
                card.dataset.title.toLowerCase().includes(searchQuery) ||
                card.dataset.content.includes(searchQuery);
            const show = matchTag && matchSearch;
            card.style.display = show ? '' : 'none';
            if (show) visible++;
        });
        visibleCount.textContent = visible;
    }

    filterBar.addEventListener('click', e => {
        if (!e.target.matches('.filter-btn')) return;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        activeFilter = e.target.dataset.filter;
        applyFilters();
    });

    document.getElementById('search-input').addEventListener('input', e => {
        searchQuery = e.target.value.toLowerCase().trim();
        applyFilters();
    });

    /* ── Copy ── */
    function copyText(index, btn) {
        const text = document.getElementById(`prompt-${index}`).innerText;
        navigator.clipboard.writeText(text).then(() => {
            btn.classList.add('copied');
            btn.querySelector('span:last-child').textContent = '已複製！';
            btn.querySelector('.copy-icon').textContent = '✓';
            setTimeout(() => {
                btn.classList.remove('copied');
                btn.querySelector('span:last-child').textContent = '複製 Prompt';
                btn.querySelector('.copy-icon').textContent = '⎘';
            }, 2200);
        }).catch(() => alert('複製失敗，請手動選取複製。'));
    }
    </script>
</body>
