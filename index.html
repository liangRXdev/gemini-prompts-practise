<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini 醫療教學 Prompt 範本庫</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-top: 4px solid var(--secondary-color);
        }
        .card h3 {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 1.2rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .prompt-box {
            background-color: #f1f3f5;
            padding: 15px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.9rem;
            flex-grow: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 200px;
            margin-bottom: 15px;
        }
        .copy-btn {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
            text-align: center;
        }
        .copy-btn:hover {
            background-color: #2980b9;
        }
        .copy-btn.copied {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Gemini 教學與教材開發 Prompt 範本庫</h1>
        <p>點擊下方按鈕即可一鍵複製提示詞範本，直接貼入 Gemini 對話框進行實作。</p>
    </div>

    <div class="container" id="prompt-container">
        </div>

    <script>
        // 資料區塊：未來新增或修改 Prompt，只需調整此陣列
        const promptData = [
            {
                title: "設計簡報大綱",
                content: "請你擔任一位專業藥師，幫我撰寫一個簡報大綱，內容關於”生成式AI在藥學的應用”，提供至少3個大綱，以Markdown方式呈現。"
            },
            {
                title: "設計簡報題目",
                content: "舉出五個吸晴的「EBM與AI」的簡報題目。"
            },
            {
                title: "簡介疾病",
                content: "介紹重症肌無力，以摘要方式回答，字數不要超過300字"
            },
            {
                title: "轉化PICO表格",
                content: "針對情境「類固醇對社區性肺炎是否有效?」轉化成PICO，以表格輸出，表格的列欄位：PICO項目│中文描述│英文關鍵字│英文同義字，表格的行欄位: P | I | C | O。"
            },
            {
                title: "繪製簡報封面",
                content: "針對簡報題目「Gemini好棒棒，老師喜歡已購買」繪製簡報封面，以全景方式呈現、以16:9方式呈現，日式漫畫風格"
            },
            {
                title: "Gem建立圖片提示詞機器人",
                content: "你現在是一個擅長寫「產生圖片提示詞」的 AI 繪圖專家，我會傳送給你要生成影像的提示詞或參考圖，你會按照下列規則進行回應：\n\n1. 我不會跟你聊天，傳送給你的所有文字都是我要產生圖片的提示詞。 \n2. 以我的提示詞為主軸，擴展成更具有想像力、畫面更好的的提示詞。 \n3. 修改的提示詞請具備「主角、簡單動作、背景、風格、視角、光線」。 \n4. 提供我兩種不同內容的繁體中文和英文提示詞。 \n5. 如果我提供你圖片，請提供請根據「主角、簡單動作、背景、風格、視角、光線」，提供我可以產生類似影像的繁體中文和英文提示詞。 \n6. 如果我傳送「縮短提示詞」，就將你美化的提示詞縮短為 50 字左右的長度，再次提供給我。\n\n參考下方範例： 提示詞原文：「一男一女在咖啡店裡喝咖啡」 美化後的提示詞：「年輕的一男一女在咖啡店裡坐在桌前喝咖啡，桌上放著一本深藍色書皮的書，男生戴著黃色毛線帽穿著灰色長袖連帽T-Shirt，女生長髮戴著紅色圍巾穿著水藍色長袖毛衣，兩個人開心的拿著白色馬克杯，一男一女都正面向鏡頭，半身照，3D 卡通黏土風格，迪士尼 3D 動畫風格，明亮舒適的光線」"
            },
            {
                title: "Nano Banana 2：人物轉換成公仔",
                content: "生成一個圖片中角色的 1/7 比例商業化公仔，公仔擺放在電腦桌上，底座是圓形透明壓克力。電腦螢幕顯示這個公仔的 ZBrush 建模過程。螢幕旁邊放置一個萬代風格的玩具包裝盒，上面印有角色原始插畫，公仔名稱為挺台灣，包裝設計採用平面插畫風格，真實照片場景，4K 高畫質，寬高比 2:3。"
            },
            {
                title: "Nano Banana 2：名畫轉真人",
                content: "將畫作中的人物轉化為一張真實的真人照片，背景改成在山間露天咖啡屋，真實照片風格"
            },
            {
                title: "Nano Banana 2：指定特定動作",
                content: "將第一張圖片在露天咖啡屋的人，動作改成第二張圖片的人物動作"
            },
            {
                title: "Nano Banana 2：跟自己小時候合照",
                content: "請產生這兩個人物在電影攝影棚裡的合照，穿西裝的大人摟著青少年的肩，開心的微笑，真實照片風格"
            },
            {
                title: "Nano Banana 2：製作漫畫",
                content: "生成三格漫畫，主題「 AI與醫療人員的未來」\n第一格：未來醫院背景，醫療人員說:「你會取代我們嗎？ 」\n第二格：AI機器人回應:「不，我是來輔佐你的。 」\n第三格：兩人一起望向未來醫院，旁白寫:「最強的力量，是合作。」\n風格為科幻美式卡通，城市夜景、光影強烈"
            },
            {
                title: "Nano Banana 2：吸入劑衛教單製作",
                content: "穿著制服的藥師正在拿著吸入劑進行吸入劑示範，目前做到動作4，先將氣體吐出。"
            },
            {
                title: "快速產生文獻資訊圖表",
                content: "繪製資訊圖表內容資訊涵蓋研究問題及設計PICO、藥物效益、主要風險、總結及臨床意義，將複雜研究結果轉譯為清晰且具臨床意義之視覺化作品，忠實反映原文作者的結論，無過度推論或斷章取義；16:9大小，資訊文字的背景為白色，圖表為可愛卡通風格，保持高對比可讀性，數字清楚，留白足夠，上方顯目標題，中間三欄等寬卡片(研究架構PICO/研究結果/重點摘要Takeaway)，最下方標註引用資訊"
            },
            {
                title: "Canvas 製作Web app小遊戲",
                content: "我要製作一個快速單選問答小遊戲，主題為[醫院好棒棒小藥師]，如何避免調劑錯誤跟危害病人安全(納入台灣藥師常見的 LASA（高警訊藥品）、三讀五對、處方糾錯（Intervention）、磨 মিলিটারি需求、以及藥物諮詢等問題)，上方會有兩條分數（調劑進度及藥害風險）。"
            },
            {
                title: "Canvas生成簡報",
                content: "分析KDIGO最新指引檔案並轉成簡報"
            },
            {
                title: "建立影片：封面圖片來回晃動",
                content: "讓人物相框進行小範圍來回晃動，不要改變字體"
            },
            {
                title: "引導式學習：跨領域個案討論準備",
                content: "用引導式學習方式，教我如何參與醫療人員的跨領域個案討論，先讓我回答一個基本問題，再根據我的回覆逐步增加難度。"
            },
            {
                title: "藥師 PBL 劇本 (Canvas 畫布)",
                content: "角色與任務：你現在是一位具備 15 年醫學中心經驗的「資深臨床藥師」與「PBL 教案撰寫專家」。請為新進藥師（PGY）設計一份關於**「多重用藥與高危險藥物交互作用」**的標準化 PBL 劇本。\n\n病患設定\n1. 案例：78 歲男性，具備心房顫動（Afib）、第二型糖尿病、高血壓病史。\n2. 近期事件：因疑似泌尿道感染（UTI）於地區診所就醫，並自行購買保健食品。\n\n核心考點\n1. 抗凝血劑（如 Warfarin 或 DOACs）與抗生素（如 TMP/SMX）的交互作用導致出血風險增加。\n2. 保健食品（如銀杏 Ginkgo）對凝血功能的隱性影響。\n\n輸出格式限制\n請以「表格」呈現，並分為三個階段（幕）：\n第一幕（門診領藥/病患主訴）：只給症狀描述與不完整的用藥史，包含 3 項干擾資訊。\n第二幕（檢驗數據與完整藥歷）：提供雲端藥歷清單（需包含 6 種以上藥物）與異常的凝血功能數據（如 INR 升高）。\n第三幕（臨床決策與處置）：列出標準解答、藥師應介入的具體建議（Intervention），以及 3 個引導學員討論的問題。\n\n語言與風格\n繁體中文，使用台灣臨床常見之醫學與藥學縮寫（如：BID, QD, INR, eGFR），語氣需專業客觀，嚴禁使用任何行銷或誇飾用語。"
            }
        ];

        const container = document.getElementById('prompt-container');

        // 動態生成卡片
        promptData.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            
            card.innerHTML = `
                <h3>${item.title}</h3>
                <div class="prompt-box" id="prompt-${index}">${item.content}</div>
                <button class="copy-btn" onclick="copyText(${index}, this)">複製 Prompt</button>
            `;
            container.appendChild(card);
        });

        // 複製功能實作
        function copyText(index, btnElement) {
            const textToCopy = document.getElementById(`prompt-${index}`).innerText;
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                // 視覺回饋
                const originalText = btnElement.innerText;
                btnElement.innerText = '已複製！';
                btnElement.classList.add('copied');
                
                setTimeout(() => {
                    btnElement.innerText = originalText;
                    btnElement.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                console.error('複製失敗:', err);
                alert('複製失敗，請手動選取複製。');
            });
        }
    </script>
</body>
</html>
